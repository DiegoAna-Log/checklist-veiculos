<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Veículos - Ana-Log</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen py-6 px-4 font-sans">

    <div class="max-w-md mx-auto bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 overflow-hidden">
        
        <!-- Cabeçalho com Logo Ana-Log -->
        <header class="bg-slate-900 p-6 text-center border-b border-slate-800 flex flex-col items-center">
            <img src="./logo.png" alt="Ana-Log - Entregando Compromisso" class="h-16 mb-2 object-contain bg-white/90 p-2 rounded-lg shadow-md" onerror="this.style.display='none'">
            <h1 class="text-xl font-bold text-white tracking-wide">Checklist Diário da Frota</h1>
            <p class="text-orange-400 text-xs mt-1 font-semibold tracking-wider uppercase">Ana-Log • Entregando Compromisso</p>
        </header>

        <!-- Formulário do Motorista -->
        <form id="checklist-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-5">

            <!-- SELEÇÃO DA PLACA -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Veículo / Placa</label>
                <div class="relative">
                    <select id="placa-select" onchange="aoSelecionarPlaca()" required class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500 appearance-none">
                        <option value="">A carregar veículos...</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                        <i class="fa-solid fa-chevron-down text-sm"></i>
                    </div>
                </div>
                <p id="qr-badge" class="text-xs text-emerald-400 mt-1 hidden"><i class="fa-solid fa-lock mr-1"></i> Veículo validado pelo QR Code</p>
                <p id="qr-error" role="status" aria-live="polite" class="text-xs text-rose-400 mt-2">Acesse pelo QR Code fixado no veículo para iniciar o checklist.</p>
            </div>

            <!-- MOTORISTA -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome do Motorista</label>
                <input type="text" id="motorista" oninput="validarKm()" placeholder="Digite seu nome completo" required class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
            </div>

            <!-- KM ATUAL -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold uppercase text-slate-400">Quilometragem Atual (KM)</label>
                    <span id="ultimo-km-info" class="text-xs text-orange-400 font-medium hidden">Último: <span id="val-ultimo-km">0</span> km</span>
                </div>
                <input type="number" id="km" min="0" step="1" inputmode="numeric" placeholder="Ex: 125000" oninput="validarKm()" required class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                <p id="km-error" class="text-xs text-rose-400 mt-1 hidden font-semibold"><i class="fa-solid fa-circle-exclamation mr-1"></i> O KM não pode ser menor que o último registrado!</p>
            </div>

            <hr class="border-slate-800">

            <!-- 1. NÍVEL DE ÓLEO E ÁGUA -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">1. Nível de Óleo e Água</label>
                <select id="oleo_agua" required onchange="validarKm()" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="OK">OK - Nível Adequado</option>
                    <option value="Atenção">Atenção - Próximo do Mínimo</option>
                    <option value="Crítico">Crítico - Incompletar / Abaixo do Mínimo</option>
                </select>
            </div>

            <!-- 2. ESTADO DOS PNEUS -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">2. Estado dos Pneus</label>
                <select id="pneus" required onchange="validarKm()" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="OK">OK - Bom Estado e Calibrados</option>
                    <option value="Gastos">Atenção - Pneus Gastos</option>
                    <option value="Furado/Danificado">Crítico - Pneu Furado ou Danificado</option>
                </select>
            </div>

            <!-- 3. LUZES E FARÓIS -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">3. Luzes e Faróis</label>
                <select id="luzes" required onchange="validarKm()" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="OK">OK - Todas Funcionando</option>
                    <option value="Lâmpada Queimada">Atenção - Lâmpada Queimada</option>
                </select>
            </div>

            <!-- 4. VISIBILIDADE -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">4. Para-brisa, Limpadores e Retrovisores</label>
                <select id="visibilidade" required onchange="validarKm()" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="OK">OK - Visibilidade normal</option>
                    <option value="Atenção - Trinca ou item danificado">Atenção - Trinca ou item danificado</option>
                    <option value="Crítico - Visibilidade comprometida">Crítico - Visibilidade comprometida</option>
                </select>
            </div>

            <!-- 5. NÍVEL DE COMBUSTÍVEL -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">5. Nível de Combustível</label>
                <select id="combustivel" required onchange="validarKm()" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="Tanque Cheio">Tanque Cheio (1/1)</option>
                    <option value="3/4">3/4 do Tanque</option>
                    <option value="1/2">Meio Tanque (1/2)</option>
                    <option value="1/4">1/4 do Tanque</option>
                    <option value="Reserva">Reserva (Atenção)</option>
                </select>
            </div>

            <!-- 5. SISTEMA DE FREIOS -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">6. Freios (Serviço e Mão)</label>
                <select id="freios" required onchange="validarKm()" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="OK">OK - Freando Normal</option>
                    <option value="Pedal Baixo/Ruído">Atenção - Pedal Baixo ou Ruído</option>
                    <option value="Deficiente">Crítico - Freio Deficiente</option>
                </select>
            </div>

            <!-- 6. EQUIPAMENTOS OBRIGATÓRIOS -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">7. Equipamentos (Macaco, Chave, Triângulo)</label>
                <select id="equipamentos" required onchange="validarKm()" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="Todos Presentes">OK - Todos Presentes e Funcionais</option>
                    <option value="Incompletos">Atenção - Item Incompleto ou Faltando</option>
                </select>
            </div>

            <!-- 7. CINTOS DE SEGURANÇA -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">8. Cintos de Segurança</label>
                <select id="cintos" required onchange="validarKm()" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="OK">OK - Todos Operacionais</option>
                    <option value="Danificado/Faltando">Atenção - Danificado ou Faltando</option>
                </select>
            </div>

            <!-- 8. LIMPEZA E HIGIENE -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">9. Limpeza e Higiene do Veículo</label>
                <select id="limpeza" required onchange="validarKm()" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500">
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="Veículo Limpo">OK - Veículo Limpo e Organizado</option>
                    <option value="Necessita Higienização">Atenção - Necessita Higienização</option>
                </select>
            </div>

            <hr class="border-slate-800">

            <!-- OBSERVAÇÕES -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Observações / Danos Identificados</label>
                <textarea id="obs" rows="3" placeholder="Descreva ruídos, riscos, amassados ou problemas operacionais..." class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-lg focus:outline-none focus:border-orange-500 text-sm"></textarea>
            </div>

            <!-- FOTO DE AVARIA -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1"><i class="fa-solid fa-camera mr-1 text-orange-500"></i> Tirar Foto de Avaria (Opcional)</label>
                <input type="file" id="foto-input" accept="image/jpeg,image/png,image/webp" capture="environment" onchange="previewImage(event)" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
                <img id="image-preview" class="mt-3 rounded-lg max-h-40 hidden border border-slate-800 mx-auto" alt="Pré-visualização">
            </div>

            <!-- BOTÃO DE ENVIO COM COR LARANJA ANA-LOG -->
            <button type="submit" id="submit-btn" disabled class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-bold text-white rounded-lg transition duration-200 shadow-lg shadow-orange-950/50 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-paper-plane"></i> Finalizar e Enviar Checklist
            </button>
        </form>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwM3sTpWs0bR_sIi-rMKiT-9tD5qor0M9QMyIn-ZCz3iI_mvf-3w4yBg48of3RNTb7G/exec";
        let ultimoKmRegistrado = 0;
        let fotoBase64 = "";
        let fotoPromise = Promise.resolve();
        let fotoSelecionada = false;
        let driverToken = "";
        let placaValidada = "";

        document.addEventListener('DOMContentLoaded', verificarParametroUrl);

        async function verificarParametroUrl() {
            const params = new URLSearchParams(window.location.search);
            const placa = (params.get('placa') || '').trim().toUpperCase();
            const token = (params.get('token') || '').trim();
            const select = document.getElementById('placa-select');
            const error = document.getElementById('qr-error');
            const button = document.getElementById('submit-btn');

            if (!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(placa) || !/^[A-Fa-f0-9]{64}$/.test(token)) {
                const temParametro = params.has('placa') || params.has('token');
                select.innerHTML = `<option value="">${temParametro ? 'QR Code incompleto' : 'Acesse pelo QR Code do veículo'}</option>`;
                error.textContent = temParametro
                    ? 'Este link está incompleto ou danificado. Peça à gestão um novo QR Code.'
                    : 'Abra a câmera do celular e leia o QR Code fixado no veículo.';
                button.disabled = true;
                return;
            }

            driverToken = token;
            placaValidada = placa;
            const option = document.createElement('option');
            option.value = placa;
            option.textContent = placa;
            select.replaceChildren(option);
            select.value = placa;
            select.disabled = true;
            error.textContent = 'Validando QR Code do veículo...';
            error.classList.remove('text-rose-400');
            error.classList.add('text-amber-300');

            try {
                const url = new URL(SCRIPT_URL);
                url.searchParams.set('action', 'getUltimoKm');
                url.searchParams.set('placa', placa);
                url.searchParams.set('token', token);
                const response = await fetch(url.toString());
                if (!response.ok) throw new Error('Falha de comunicação');
                const result = await response.json();
                if (result.status !== 'sucesso') {
                    error.textContent = 'QR Code não reconhecido. Peça à gestão para gerar um novo.';
                    error.classList.remove('text-amber-300');
                    error.classList.add('text-rose-400');
                    throw new Error(result.message || 'QR Code inválido.');
                }

                ultimoKmRegistrado = Number(result.ultimoKm) || 0;
                document.getElementById('val-ultimo-km').innerText = ultimoKmRegistrado.toLocaleString('pt-BR');
                document.getElementById('ultimo-km-info').classList.remove('hidden');
                document.getElementById('qr-badge').classList.remove('hidden');
                error.classList.add('hidden');
                validarKm();
            } catch (err) {
                driverToken = '';
                placaValidada = '';
                button.disabled = true;
                if (error.textContent === 'Validando QR Code do veículo...') {
                    error.textContent = 'Não foi possível validar agora. Confira sua conexão e tente novamente.';
                    error.classList.remove('text-amber-300');
                    error.classList.add('text-rose-400');
                }
                console.error(err);
            }
        }

        function aoSelecionarPlaca() {
            // A placa só pode ser definida pelo QR validado no servidor.
        }

        function validarKm() {
            const raw = document.getElementById('km').value;
            const kmDigitado = Number(raw);
            const invalid = raw === '' || !Number.isInteger(kmDigitado) || kmDigitado < ultimoKmRegistrado;
            const kmError = document.getElementById('km-error');
            const submitBtn = document.getElementById('submit-btn');
            kmError.classList.toggle('hidden', raw === '' || !invalid);
            const requiredIds = ['motorista', 'oleo_agua', 'pneus', 'luzes', 'visibilidade', 'combustivel', 'freios', 'equipamentos', 'cintos', 'limpeza'];
            const formIncomplete = requiredIds.some(id => !document.getElementById(id).value.trim());
            submitBtn.disabled = !driverToken || invalid || formIncomplete;
            submitBtn.classList.toggle('opacity-50', submitBtn.disabled);
            submitBtn.classList.toggle('cursor-not-allowed', submitBtn.disabled);
        }

        function previewImage(event) {
            const file = event.target.files && event.target.files[0];
            const preview = document.getElementById('image-preview');
            fotoBase64 = '';
            fotoSelecionada = !!file;
            if (!file) {
                preview.src = '';
                preview.classList.add('hidden');
                fotoPromise = Promise.resolve();
                return;
            }
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
                event.target.value = '';
                fotoSelecionada = false;
                alert('Selecione um arquivo de imagem.');
                return;
            }
            fotoPromise = comprimirImagem(file).then(dataUrl => {
                fotoBase64 = dataUrl;
                preview.src = dataUrl;
                preview.classList.remove('hidden');
            }).catch(err => {
                fotoBase64 = '';
                fotoSelecionada = false;
                event.target.value = '';
                preview.src = '';
                preview.classList.add('hidden');
                alert(err.message || 'Não foi possível preparar a foto.');
            });
        }

        function comprimirImagem(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Falha ao ler a foto.'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('Arquivo de imagem inválido.'));
                    img.onload = () => {
                        if (!img.width || !img.height || img.width * img.height > 40000000) {
                            return reject(new Error('A imagem é grande ou inválida. Tire outra foto.'));
                        }
                        const maxSide = 1600;
                        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));
                        const context = canvas.getContext('2d');
                        if (!context || typeof canvas.toBlob !== 'function') return reject(new Error('Este navegador não consegue processar a foto.'));
                        context.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(blob => {
                            if (!blob) return reject(new Error('Não foi possível comprimir a foto.'));
                            if (blob.size > 4 * 1024 * 1024) return reject(new Error('A foto continua grande. Tire outra com menor resolução.'));
                            const out = new FileReader();
                            out.onerror = () => reject(new Error('Falha ao preparar a foto.'));
                            out.onload = () => resolve(out.result);
                            out.readAsDataURL(blob);
                        }, 'image/jpeg', 0.78);
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (!driverToken || !placaValidada) {
                alert('Leia o QR Code do veículo antes de enviar.');
                return;
            }
            const submitBtn = document.getElementById('submit-btn');
            const originalLabel = '<i class="fa-solid fa-paper-plane"></i> Finalizar e Enviar Checklist';
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> A enviar checklist...';
            submitBtn.disabled = true;

            try {
                await fotoPromise;
                if (fotoSelecionada && !fotoBase64) throw new Error('A foto não foi preparada. Remova-a ou selecione outra.');
                const payload = {
                    action: 'registrarChecklist',
                    token: driverToken,
                    placa: placaValidada,
                    motorista: document.getElementById('motorista').value.trim(),
                    km: document.getElementById('km').value,
                    oleo_agua: document.getElementById('oleo_agua').value,
                    pneus: document.getElementById('pneus').value,
                    luzes: document.getElementById('luzes').value,
                    visibilidade: document.getElementById('visibilidade').value,
                    combustivel: document.getElementById('combustivel').value,
                    freios: document.getElementById('freios').value,
                    equipamentos: document.getElementById('equipamentos').value,
                    cintos: document.getElementById('cintos').value,
                    limpeza: document.getElementById('limpeza').value,
                    obs: document.getElementById('obs').value,
                    fotoBase64: fotoBase64
                };
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error('Falha de comunicação com o servidor.');
                const result = await response.json();
                if (result.status !== 'sucesso') throw new Error(result.message || 'O checklist não foi salvo.');

                alert('✅ Checklist salvo com sucesso!');
                const kmEnviado = Number(payload.km);
                document.getElementById('checklist-form').reset();
                document.getElementById('placa-select').value = placaValidada;
                document.getElementById('image-preview').classList.add('hidden');
                document.getElementById('image-preview').src = '';
                fotoBase64 = '';
                fotoSelecionada = false;
                fotoPromise = Promise.resolve();
                ultimoKmRegistrado = Math.max(ultimoKmRegistrado, kmEnviado);
                document.getElementById('val-ultimo-km').innerText = ultimoKmRegistrado.toLocaleString('pt-BR');
                document.getElementById('ultimo-km-info').classList.remove('hidden');
            } catch (err) {
                alert('❌ ' + (err.message || 'Não foi possível salvar. Seus dados continuam no formulário; tente novamente.'));
                console.error(err);
            } finally {
                submitBtn.innerHTML = originalLabel;
                validarKm();
            }
        }
    </script>
</body>
</html>
