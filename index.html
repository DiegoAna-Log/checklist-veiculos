<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Veículo - Controle de Frota</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen py-6 px-4 font-sans">

    <div class="max-w-md mx-auto bg-slate-800 rounded-2xl shadow-xl border border-slate-700 overflow-hidden">
        
        <header class="bg-blue-600 p-6 text-center">
            <div class="w-12 h-12 bg-white/10 text-white rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                <i class="fa-solid fa-clipboard-check"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Checklist Diário do Veículo</h1>
            <p class="text-blue-100 text-xs mt-1">Inspeção rápida antes de iniciar a rodagem</p>
        </header>

        <form id="checklist-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-5">

            <!-- SELEÇÃO DA PLACA -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Veículo / Placa</label>
                <div class="relative">
                    <select id="placa-select" onchange="aoSelecionarPlaca()" required class="w-full p-3 bg-slate-900 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-blue-500 appearance-none">
                        <option value="">A carregar veículos...</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                        <i class="fa-solid fa-chevron-down text-sm"></i>
                    </div>
                </div>
                <p id="qr-badge" class="text-xs text-emerald-400 mt-1 hidden"><i class="fa-solid fa-lock mr-1"></i> Veículo fixado via QR Code (Bloqueado)</p>
            </div>

            <!-- MOTORISTA -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome do Motorista</label>
                <input type="text" id="motorista" placeholder="Digite seu nome completo" required class="w-full p-3 bg-slate-900 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-blue-500">
            </div>

            <!-- KM ATUAL -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold uppercase text-slate-400">Quilometragem Atual (KM)</label>
                    <span id="ultimo-km-info" class="text-xs text-blue-400 font-medium hidden">Último: <span id="val-ultimo-km">0</span> km</span>
                </div>
                <input type="number" id="km" placeholder="Ex: 125000" oninput="validarKm()" required class="w-full p-3 bg-slate-900 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-blue-500">
                <p id="km-error" class="text-xs text-rose-400 mt-1 hidden font-semibold"><i class="fa-solid fa-circle-exclamation mr-1"></i> O KM não pode ser menor que o último registrado!</p>
            </div>

            <!-- NÍVEL DE ÓLEO E ÁGUA -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nível de Óleo e Água</label>
                <select id="oleo_agua" required class="w-full p-3 bg-slate-900 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-blue-500">
                    <option value="OK">OK - Nível Adequado</option>
                    <option value="Atenção">Atenção - Próximo do Mínimo</option>
                    <option value="Crítico">Crítico - Incompletar Impossível</option>
                </select>
            </div>

            <!-- ESTADO DOS PNEUS -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Estado dos Pneus</label>
                <select id="pneus" required class="w-full p-3 bg-slate-900 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-blue-500">
                    <option value="OK">OK - Bom Estado e Calibrados</option>
                    <option value="Gastos">Atenção - Pneus Gastos</option>
                    <option value="Furado/Danificado">Crítico - Pneu Furado ou Danificado</option>
                </select>
            </div>

            <!-- LUZES E FARÓIS -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Luzes e Faróis</label>
                <select id="luzes" required class="w-full p-3 bg-slate-900 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-blue-500">
                    <option value="OK">OK - Todas Funcionando</option>
                    <option value="Lâmpada Queimada">Atenção - Lâmpada Queimada</option>
                </select>
            </div>

            <!-- OBSERVAÇÕES -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Observações / Danos Identificados</label>
                <textarea id="obs" rows="3" placeholder="Descreva ruídos, riscos, amassados ou problemas operacionais..." class="w-full p-3 bg-slate-900 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-blue-500 text-sm"></textarea>
            </div>

            <!-- FOTO DE AVARIA -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1"><i class="fa-solid fa-camera mr-1"></i> Tirar Foto de Avaria (Opcional)</label>
                <input type="file" id="foto-input" accept="image/*" capture="environment" onchange="previewImage(event)" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600">
                <img id="image-preview" class="mt-3 rounded-lg max-h-40 hidden border border-slate-700 mx-auto" alt="Pré-visualização">
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 font-bold text-white rounded-lg transition duration-200 shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Finalizar e Enviar Checklist
            </button>
        </form>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwM3sTpWs0bR_sIi-rMKiT-9tD5qor0M9QMyIn-ZCz3iI_mvf-3w4yBg48of3RNTb7G/exec";

        let ultimoKmRegistrado = 0;
        let fotoBase64 = "";

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarVeiculos();
            verificarParametroUrl();
        });

        async function carregarVeiculos() {
            const select = document.getElementById('placa-select');
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=getVeiculos`);
                const data = await resp.json();
                
                if (Array.isArray(data) && data.length > 1) {
                    select.innerHTML = '<option value="">-- Selecione o Veículo --</option>';
                    data.slice(1).forEach(row => {
                        const placa = row[0];
                        const marcaModelo = `${row[1]} ${row[2]}`;
                        if (placa) {
                            select.innerHTML += `<option value="${placa}">${placa} - ${marcaModelo}</option>`;
                        }
                    });
                } else {
                    select.innerHTML = '<option value="">Nenhum veículo encontrado</option>';
                }
            } catch (err) {
                console.error("Erro ao carregar veículos:", err);
            }
        }

        function verificarParametroUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const placaUrl = urlParams.get('placa');

            if (placaUrl) {
                const select = document.getElementById('placa-select');
                let encontrou = false;
                
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].value.toUpperCase() === placaUrl.toUpperCase()) {
                        select.selectedIndex = i;
                        encontrou = true;
                        break;
                    }
                }

                if (!encontrou) {
                    const opt = document.createElement('option');
                    opt.value = placaUrl.toUpperCase();
                    opt.text = `${placaUrl.toUpperCase()} (QR Code)`;
                    select.add(opt);
                    select.value = placaUrl.toUpperCase();
                }

                // BLOQUEIA A ALTERAÇÃO DA PLACA PELO MOTORISTA
                select.disabled = true;
                select.classList.add('bg-slate-800', 'cursor-not-allowed', 'opacity-80');

                document.getElementById('qr-badge').classList.remove('hidden');
                aoSelecionarPlaca();
            }
        }

        async function aoSelecionarPlaca() {
            const placa = document.getElementById('placa-select').value;
            const kmInfoBox = document.getElementById('ultimo-km-info');
            const valUltimoKm = document.getElementById('val-ultimo-km');
            
            if (!placa) {
                kmInfoBox.classList.add('hidden');
                ultimoKmRegistrado = 0;
                return;
            }

            try {
                const resp = await fetch(`${SCRIPT_URL}?action=getUltimoKm&placa=${encodeURIComponent(placa)}`);
                const data = await resp.json();
                
                ultimoKmRegistrado = data.ultimoKm || 0;
                valUltimoKm.innerText = ultimoKmRegistrado;
                kmInfoBox.classList.remove('hidden');
                validarKm();
            } catch (err) {
                console.error("Erro ao buscar último KM:", err);
            }
        }

        function validarKm() {
            const kmDigitado = parseInt(document.getElementById('km').value) || 0;
            const kmError = document.getElementById('km-error');
            const submitBtn = document.getElementById('submit-btn');

            if (ultimoKmRegistrado > 0 && kmDigitado < ultimoKmRegistrado) {
                kmError.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                kmError.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) {
                fotoBase64 = "";
                document.getElementById('image-preview').classList.add('hidden');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                fotoBase64 = e.target.result;
                const preview = document.getElementById('image-preview');
                preview.src = fotoBase64;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> A enviar checklist...';
            submitBtn.disabled = true;

            const payload = {
                placa: document.getElementById('placa-select').value,
                motorista: document.getElementById('motorista').value,
                km: document.getElementById('km').value,
                oleo_agua: document.getElementById('oleo_agua').value,
                pneus: document.getElementById('pneus').value,
                luzes: document.getElementById('luzes').value,
                obs: document.getElementById('obs').value,
                fotoBase64: fotoBase64
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                alert("✅ Checklist enviado com sucesso!");
                document.getElementById('checklist-form').reset();
                document.getElementById('image-preview').classList.add('hidden');
                document.getElementById('ultimo-km-info').classList.add('hidden');
                fotoBase64 = "";
            } catch (err) {
                alert("❌ Erro ao enviar checklist.");
                console.error(err);
            } finally {
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Finalizar e Enviar Checklist';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
